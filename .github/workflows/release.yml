# Release pipeline. Spec: docs/ci-cd.md §5
# staging push  -> release-candidate build (artifact only, unsigned unless secrets exist)
# tag v* on main -> signed + notarized DMG attached to a draft GitHub Release
name: Release

on:
  push:
    branches: [staging]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    permissions:
      contents: write   # only to create the draft release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tags must point at main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - run: ci/macos-toolchain.sh
      - run: swift test --parallel
      - name: Universal release build + Dedock.app
        run: ci/build-app.sh release universal
      - name: Ad-hoc package (staging / manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ci/sign-notarize.sh
      - name: Sign, notarize, staple, DMG (tags on main only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: ci/sign-notarize.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Dedock-${{ github.ref_name }}-${{ github.sha }}
          path: build/dist/*
          retention-days: 30
      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/dist/* --draft --generate-notes --title "dedock $GITHUB_REF_NAME"
